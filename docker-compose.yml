services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dodeed
      POSTGRES_PASSWORD: dodeed
      POSTGRES_DB: dodeed
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dodeed"]
      interval: 3s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
